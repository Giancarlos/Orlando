[package]
name = "orlando-cluster"
version = "0.1.0"
edition = "2024"

[features]
default = []
consul = ["dep:reqwest", "dep:serde_json"]
tcp-transport = ["dep:tokio-util", "dep:bytes", "dep:futures-util"]

[dependencies]
orlando-core = { path = "../orlando-core" }
orlando-persistence = { path = "../orlando-persistence" }
orlando-runtime = { path = "../orlando-runtime" }
tokio = { workspace = true }
async-trait = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
fastrand = "2"
axum = "0.7"
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
